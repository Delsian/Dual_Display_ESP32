name: parrot-local
services:
  ollama:
    image: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    cpus: 2.0
    # Requested limits: voron's current kernel lacks memory cgroup support.
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "5m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  ollama:
