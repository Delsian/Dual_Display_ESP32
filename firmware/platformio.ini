; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-dualeye-touch-lcd-1_28

[env:esp32-s3-dualeye-touch-lcd-1_28]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_mode = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    tzapu/WiFiManager@2.0.17
    bodmer/TFT_eSPI@^2.5.43
    sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3
build_flags =
    -DBOARD_WAVESHARE_DUALEYE
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_HSPI_PORT
    -DUSER_SETUP_LOADED=1
    -DLOAD_FONT2=1 ; Wi-Fi setup and debug text use font 2.
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    ; Conservative clock for the shared bus to both onboard displays.
    -DSPI_FREQUENCY=40000000
    -DTFT_MOSI=42
    -DTFT_SCLK=41
    -DTFT_MISO=40
    -DTFT_DC=45
    -DTFT_CS=-1
    -DTFT_CS_L=47
    -DTFT_CS_R=38
    ; Reset each panel explicitly; TFT_eSPI must not reset LCD1 for LCD2.
    -DTFT_RST=-1
    -DTFT_RST_L=48
    -DTFT_RST_R=8
    -DTFT_BL=46
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BL_R=39

